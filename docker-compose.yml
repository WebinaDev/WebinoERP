# WebinoERP — Architecture §13 service names.
# Only `web` publishes host ports. Reverb stays on `ws` (not used by Dashboard).

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-webina_crm}
      POSTGRES_USER: ${POSTGRES_USER:-webino}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webino}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-webino} -d ${POSTGRES_DB:-webina_crm}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - webino_erp

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - webino_erp

  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    entrypoint: ["sh", "/entrypoint.sh"]
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/entrypoint.sh:/entrypoint.sh:ro
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-webina_crm}
      DB_USERNAME: ${POSTGRES_USER:-webino}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-webino}
      REDIS_HOST: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      BROADCAST_CONNECTION: reverb
      OCTANE_SERVER: frankenphp
    healthcheck:
      # metrics does not require migrated tables (readiness returns 503 pre-migrate)
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/api/v1/core/health/metrics >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: php artisan serve --host=0.0.0.0 --port=8080
    networks:
      - webino_erp

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    entrypoint: ["sh", "/entrypoint.sh"]
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/entrypoint.sh:/entrypoint.sh:ro
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: local
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-webina_crm}
      DB_USERNAME: ${POSTGRES_USER:-webino}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-webino}
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      RUN_MIGRATIONS: "0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    command: php artisan queue:work redis --sleep=3 --tries=3
    networks:
      - webino_erp

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    entrypoint: ["sh", "/entrypoint.sh"]
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/entrypoint.sh:/entrypoint.sh:ro
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: local
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-webina_crm}
      DB_USERNAME: ${POSTGRES_USER:-webino}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-webino}
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      RUN_MIGRATIONS: "0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    command: php artisan schedule:work
    networks:
      - webino_erp

  ws:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    entrypoint: ["sh", "/entrypoint.sh"]
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/entrypoint.sh:/entrypoint.sh:ro
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: local
      DB_HOST: db
      REDIS_HOST: redis
      BROADCAST_CONNECTION: reverb
    depends_on:
      redis:
        condition: service_healthy
    command: php artisan reverb:start --host=0.0.0.0 --port=8081
    networks:
      - webino_erp

  frontend:
    build:
      context: ..
      dockerfile: WebinoERP/docker/next/Dockerfile
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ""
      INTERNAL_API_URL: http://backend:8080
      API_PROXY_TARGET: http://backend:8080
      AUTH_COOKIE_NAME: webino_auth_token
      NEXT_PUBLIC_REVERB_PORT: "8081"
    healthcheck:
      # Any HTTP response means Next is listening (SSR may 500 while backend is down).
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/',()=>process.exit(0)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s
    depends_on:
      - backend
    networks:
      - webino_erp

  web:
    image: caddy:2-alpine
    ports:
      - "${WEB_HTTP_PORT:-3080}:80"
      - "${WEB_HTTPS_PORT:-3443}:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
      ws:
        condition: service_started
    networks:
      - webino_erp

  docs:
    profiles: ["docs", "dev"]
    build:
      context: ./docs-site
      dockerfile: Dockerfile
    networks:
      - webino_erp

networks:
  webino_erp:
    driver: bridge

volumes:
  redis_data:
  db_data:
