# WebinoERP — Architecture §13 service names.
# Only `web` publishes host ports. Reverb stays on `ws` (not used by Dashboard).

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-webina_crm}
      POSTGRES_USER: ${POSTGRES_USER:-webino}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webino}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-webino} -d ${POSTGRES_DB:-webina_crm}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - webino_erp

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-CHANGE_ME}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-CHANGE_ME}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - webino_erp

  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    restart: unless-stopped
    entrypoint: ["sh", "/entrypoint.sh"]
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/entrypoint.sh:/entrypoint.sh:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/webino:/var/lib/webino
      - ./docker/caddy/sites:/opt/webinoerp/docker/caddy/sites
      - ./scripts:/opt/webinoerp-scripts:ro
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: ${APP_URL:-http://localhost}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-webina_crm}
      DB_USERNAME: ${POSTGRES_USER:-webino}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-webino}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-CHANGE_ME}
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      SESSION_SECURE_COOKIE: "${SESSION_SECURE_COOKIE:-false}"
      SANCTUM_STATEFUL_DOMAINS: "${SANCTUM_STATEFUL_DOMAINS:-localhost,localhost:3000,127.0.0.1,127.0.0.1:8000,webinaagency.ir,www.webinaagency.ir}"
      QUEUE_CONNECTION: redis
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-webino}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-CHANGE_ME}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-CHANGE_ME}
      OCTANE_SERVER: frankenphp
      WEBINO_SITES_CADDY_DIR: /opt/webinoerp/docker/caddy/sites
      WEBINO_DASHBOARD_BUILD_SCRIPT: /opt/webinoerp-scripts/build-webino-dashboard-images.sh
      WEBINO_DASHBOARD_GIT_URL: ${WEBINO_DASHBOARD_GIT_URL:-https://github.com/Webinadev/WebinoDashboard.git}
      WEBINO_DASHBOARD_GIT_REF: ${WEBINO_DASHBOARD_GIT_REF:-main}
      WEBINO_DASHBOARD_SRC: /var/lib/webino/src/WebinoDashboard
    healthcheck:
      # metrics does not require migrated tables (readiness returns 503 pre-migrate)
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/api/v1/core/health/metrics >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: php artisan serve --host=0.0.0.0 --port=8080
    networks:
      webino_erp:
        aliases: [erp-backend]

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    restart: unless-stopped
    entrypoint: ["sh", "/entrypoint.sh"]
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/entrypoint.sh:/entrypoint.sh:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/webino:/var/lib/webino
      - ./docker/caddy/sites:/opt/webinoerp/docker/caddy/sites
      - ./scripts:/opt/webinoerp-scripts:ro
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: local
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-webina_crm}
      DB_USERNAME: ${POSTGRES_USER:-webino}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-webino}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-CHANGE_ME}
      QUEUE_CONNECTION: redis
      RUN_MIGRATIONS: "0"
      WEBINO_SITES_CADDY_DIR: /opt/webinoerp/docker/caddy/sites
      WEBINO_DASHBOARD_BUILD_SCRIPT: /opt/webinoerp-scripts/build-webino-dashboard-images.sh
      WEBINO_DASHBOARD_GIT_URL: ${WEBINO_DASHBOARD_GIT_URL:-https://github.com/Webinadev/WebinoDashboard.git}
      WEBINO_DASHBOARD_GIT_REF: ${WEBINO_DASHBOARD_GIT_REF:-main}
      WEBINO_DASHBOARD_SRC: /var/lib/webino/src/WebinoDashboard
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=2400
    networks:
      - webino_erp

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    restart: unless-stopped
    entrypoint: ["sh", "/entrypoint.sh"]
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/entrypoint.sh:/entrypoint.sh:ro
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: local
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-webina_crm}
      DB_USERNAME: ${POSTGRES_USER:-webino}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-webino}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-CHANGE_ME}
      QUEUE_CONNECTION: redis
      RUN_MIGRATIONS: "0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    command: php artisan schedule:work
    networks:
      - webino_erp

  ws:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    restart: unless-stopped
    entrypoint: ["sh", "/entrypoint.sh"]
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/entrypoint.sh:/entrypoint.sh:ro
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: local
      DB_HOST: db
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-CHANGE_ME}
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-webino}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-CHANGE_ME}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-CHANGE_ME}
    depends_on:
      redis:
        condition: service_healthy
    command: php artisan reverb:start --host=0.0.0.0 --port=8081
    networks:
      - webino_erp

  frontend:
    build:
      context: ..
      dockerfile: WebinoERP/docker/next/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: "/api"
      INTERNAL_API_URL: http://backend:8080
      API_PROXY_TARGET: http://backend:8080
      AUTH_COOKIE_NAME: webino_auth_token
      NEXT_PUBLIC_REVERB_PORT: "8081"
    healthcheck:
      # Any HTTP response means Next is listening (SSR may 500 while backend is down).
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/',()=>process.exit(0)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s
    depends_on:
      - backend
    networks:
      webino_erp:
        aliases: [erp-frontend]

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${WEB_HTTP_PORT:-3080}:80"
      - "${WEB_HTTPS_PORT:-3443}:443"
    environment:
      CADDY_ACME_EMAIL: "${CADDY_ACME_EMAIL:-admin@localhost}"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Durable tenant snippets (survive git clean / update.sh). Backend writes here too.
      - /var/lib/webino/caddy.d:/etc/caddy/sites
      # Persist Let's Encrypt certs across recreate/update — never delete this volume.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
      ws:
        condition: service_started
    networks:
      - webino_erp
      - webino_sites

  docs:
    profiles: ["docs", "dev"]
    build:
      context: ./docs-site
      dockerfile: Dockerfile
    networks:
      - webino_erp

networks:
  webino_erp:
    driver: bridge
  # Shared with per-tenant WebinoDashboard stacks (LocalSameVpsProvisioner).
  webino_sites:
    name: webino_sites
    driver: bridge

volumes:
  redis_data:
  db_data:
  caddy_data:
  caddy_config:
