# Production overlay:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# install.sh always applies this overlay. Only `web` remains published.

services:
  backend:
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      SESSION_SECURE_COOKIE: "${SESSION_SECURE_COOKIE:-true}"
      QUEUE_CONNECTION: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-}

  frontend:
    environment:
      NODE_ENV: production

  worker:
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      QUEUE_CONNECTION: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

  scheduler:
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

  ws:
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-}

  web:
    ports:
      - "${WEB_HTTP_PORT:-80}:80"
      - "${WEB_HTTPS_PORT:-443}:443"
    environment:
      CADDY_ACME_EMAIL: "${CADDY_ACME_EMAIL:-admin@webinaagency.ir}"
