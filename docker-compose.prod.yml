# Production overlay:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Only `web` remains published.

services:
  backend:
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      QUEUE_CONNECTION: redis

  frontend:
    environment:
      NODE_ENV: production

  worker:
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      QUEUE_CONNECTION: redis

  scheduler:
    environment:
      APP_ENV: production
      APP_DEBUG: "false"

  web:
    ports:
      - "${WEB_HTTP_PORT:-80}:80"
      - "${WEB_HTTPS_PORT:-443}:443"
