# Production overlay:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# install.sh always applies this overlay. Only `web` remains published.

services:
  backend:
    environment:
      LOG_STACK: ${LOG_STACK:-daily}
      LOG_DAILY_DAYS: ${LOG_DAILY_DAYS:-14}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "${APP_URL:-https://webina.dev}"
      SESSION_SECURE_COOKIE: "${SESSION_SECURE_COOKIE:-true}"
      SANCTUM_STATEFUL_DOMAINS: "${SANCTUM_STATEFUL_DOMAINS:-webina.dev,www.webina.dev,contact.webina.dev,webinaagency.ir,www.webinaagency.ir}"
      QUEUE_CONNECTION: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-CHANGE_ME}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-}

  frontend:
    environment:
      NODE_ENV: production

  worker:
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      QUEUE_CONNECTION: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-CHANGE_ME}

  scheduler:
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-CHANGE_ME}

  ws:
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-CHANGE_ME}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-}

  web:
    ports:
      - "${WEB_HTTP_PORT:-80}:80"
      - "${WEB_HTTPS_PORT:-443}:443"
    environment:
      CADDY_ACME_EMAIL: "${CADDY_ACME_EMAIL:-admin@webina.dev}"
