# Iranian Docker Hub mirrors (Hub returns 403 for IR IPs).
# Applied automatically by update.sh / install.sh unless WEBINO_IRAN_DOCKER=0.
#
# Manual:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.iran.yml up -d --build
#
# Override any image via .env (e.g. FRANKENPHP no longer used in PHP Dockerfile).

services:
  db:
    image: ${POSTGRES_IMAGE:-hub.hamdocker.ir/library/postgres:15-alpine}

  redis:
    image: ${REDIS_IMAGE:-hub.hamdocker.ir/library/redis:7-alpine}

  web:
    image: ${CADDY_IMAGE:-hub.hamdocker.ir/library/caddy:2-alpine}

  backend:
    build:
      args:
        PHP_IMAGE: ${PHP_IMAGE:-hub.hamdocker.ir/library/php:8.3-cli-bookworm}
        COMPOSER_IMAGE: ${COMPOSER_IMAGE:-hub.hamdocker.ir/library/composer:2}
        DOCKER_CLI_IMAGE: ${DOCKER_CLI_IMAGE:-hub.hamdocker.ir/library/docker:27-cli}

  worker:
    build:
      args:
        PHP_IMAGE: ${PHP_IMAGE:-hub.hamdocker.ir/library/php:8.3-cli-bookworm}
        COMPOSER_IMAGE: ${COMPOSER_IMAGE:-hub.hamdocker.ir/library/composer:2}
        DOCKER_CLI_IMAGE: ${DOCKER_CLI_IMAGE:-hub.hamdocker.ir/library/docker:27-cli}

  scheduler:
    build:
      args:
        PHP_IMAGE: ${PHP_IMAGE:-hub.hamdocker.ir/library/php:8.3-cli-bookworm}
        COMPOSER_IMAGE: ${COMPOSER_IMAGE:-hub.hamdocker.ir/library/composer:2}
        DOCKER_CLI_IMAGE: ${DOCKER_CLI_IMAGE:-hub.hamdocker.ir/library/docker:27-cli}

  ws:
    build:
      args:
        PHP_IMAGE: ${PHP_IMAGE:-hub.hamdocker.ir/library/php:8.3-cli-bookworm}
        COMPOSER_IMAGE: ${COMPOSER_IMAGE:-hub.hamdocker.ir/library/composer:2}
        DOCKER_CLI_IMAGE: ${DOCKER_CLI_IMAGE:-hub.hamdocker.ir/library/docker:27-cli}

  frontend:
    build:
      args:
        NODE_IMAGE: ${NODE_IMAGE:-hub.hamdocker.ir/library/node:22-alpine}
