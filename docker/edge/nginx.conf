# Edge micro-cache in front of Next.js (public pages only).
# Next renders public pages per request (locale comes from a cookie). Page HTML does
# not depend on the visitor otherwise (cart/account load client-side), so anonymous
# document GETs are cached per host + path + locale for a short time. Builder
# publishes show up within PAGE_TTL (+10s builder data cache in Next).
# Rollback: point Caddy's default handle back to erp-frontend:3000 and reload.

proxy_cache_path /var/cache/nginx/pages levels=1:2 keys_zone=pages:20m max_size=512m inactive=10m use_temp_path=off;

map $cookie_NEXT_LOCALE $edge_locale {
    default fa;
    en      en;
}

# Never cache: app areas, per-user pages, Next data/RSC requests, non-GET.
map $uri $edge_skip_path {
    default 0;
    ~^/(dashboard|login|admin|account|cart|checkout|preview|connect|api|lucide-icon)(/|$) 1;
    ~^/_next/ 1;
}
map "$request_method:$http_rsc$http_next_router_prefetch$http_next_action" $edge_skip_req {
    default 1;
    "GET:"  0;
    "HEAD:" 0;
}
map "$edge_skip_path$edge_skip_req" $edge_bypass {
    default 1;
    "00"    0;
}

upstream next_app {
    server erp-frontend:3000;
    keepalive 32;
}

server {
    listen 8080;
    server_tokens off;
    client_max_body_size 64m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
    proxy_read_timeout 120s;
    proxy_buffers 32 16k;

    location / {
        proxy_pass http://next_app;

        proxy_cache pages;
        proxy_cache_key "$host$uri$is_args$args|$edge_locale";
        proxy_cache_bypass $edge_bypass;
        proxy_no_cache $edge_bypass;
        proxy_cache_valid 200 30s;
        proxy_cache_valid 404 10s;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        # Next marks dynamic pages no-store and sets NEXT_LOCALE; neither may block caching.
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
        add_header X-Edge-Cache $upstream_cache_status always;
    }
}

# ---- Webina tenant image cache (added by WebinoERP perf work; rollback: remove this block + Caddy tenant_img) ----
proxy_cache_path /var/cache/nginx/webina_img levels=1:2 keys_zone=webina_img:50m max_size=5g inactive=30d use_temp_path=off;
map $http_accept $webina_img_fmt { default "orig"; "~*image/avif" "avif"; "~*image/webp" "webp"; }
map $http_x_webina_tenant $webina_tenant_ok { default ""; "~^ws-[a-z0-9-]+$" $http_x_webina_tenant; }
server {
    listen 8081;
    resolver 127.0.0.11 valid=30s ipv6=off;
    if ($webina_tenant_ok = "") { return 403; }
    location /_next/image {
        proxy_pass http://$webina_tenant_ok-frontend:3000;
        proxy_set_header Host $host;
        proxy_cache webina_img; proxy_cache_key "$host$request_uri$webina_img_fmt";
        proxy_cache_valid 200 30d; proxy_cache_use_stale error timeout updating; proxy_cache_lock on;
        proxy_ignore_headers Set-Cookie Cache-Control Expires Vary; proxy_hide_header Set-Cookie; proxy_hide_header Cache-Control;
        add_header Vary Accept always; add_header X-Edge-Cache $upstream_cache_status always;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }
    location ~* ^/(storage|uploads|media)/.+\.(webp|avif|jpe?g|png|gif|svg)$ {
        proxy_pass http://$webina_tenant_ok-backend:8080;
        proxy_set_header Host $host;
        proxy_cache webina_img; proxy_cache_key "$host$request_uri";
        proxy_cache_valid 200 30d; proxy_cache_use_stale error timeout updating; proxy_cache_lock on;
        proxy_ignore_headers Set-Cookie Cache-Control Expires Vary; proxy_hide_header Set-Cookie; proxy_hide_header Cache-Control;
        add_header X-Edge-Cache $upstream_cache_status always;
        add_header Cache-Control "public, max-age=2592000" always;
    }
    location / { return 404; }
}
