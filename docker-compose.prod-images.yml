# Prebuilt-image overlay (GHCR images from .github/workflows/images.yml). Always appended LAST
# by scripts/deploy-pull.sh. Services = every service that has 'build:' in the real stack;
# db/redis/web/edge already use upstream images and are not overridden.
# Validated with: docker compose worker -f docker-compose.prod-images.yml config
services:
  backend:
    image: ${IMAGE_REGISTRY:-ghcr.io/webinadev}/webino-erp-backend:${IMAGE_TAG:?set IMAGE_TAG}
    pull_policy: missing
    environment:
      WEBINO_INTERNAL_API_SECRET: ${WEBINO_INTERNAL_API_SECRET:-}
  worker:
    image: ${IMAGE_REGISTRY:-ghcr.io/webinadev}/webino-erp-backend:${IMAGE_TAG:?set IMAGE_TAG}
    pull_policy: missing
  scheduler:
    image: ${IMAGE_REGISTRY:-ghcr.io/webinadev}/webino-erp-backend:${IMAGE_TAG:?set IMAGE_TAG}
    pull_policy: missing
  ws:
    image: ${IMAGE_REGISTRY:-ghcr.io/webinadev}/webino-erp-backend:${IMAGE_TAG:?set IMAGE_TAG}
    pull_policy: missing
  frontend:
    image: ${IMAGE_REGISTRY:-ghcr.io/webinadev}/webino-erp-frontend:${IMAGE_TAG:?set IMAGE_TAG}
    pull_policy: missing
    environment:
      WEBINO_INTERNAL_API_SECRET: ${WEBINO_INTERNAL_API_SECRET:-}
